<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gym Management System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>FITZONE GYM</h1>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/members">Members</a>
        <a href="/members/new">Add Member</a>
    <form class="logout-form" th:action="@{/logout}" method="post"><button class="logout-btn" type="submit">Logout</button></form>
    </nav>
</header>

<main>
    <section class="hero">
        <div>
            <h2>Gym Management Dashboard</h2>
            <p>Manage gym members, plans and daily operations easily.</p>
        </div>
        <a class="btn" href="/members/new">+ Add Member</a>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Total Members</h3>
            <p th:text="${memberCount}">0</p>
        </div>
        <div class="card">
            <h3>Membership Plans</h3>
            <p>3</p>
        </div>
        <div class="card">
            <h3>System Status</h3>
            <p class="active">Active</p>
        </div>
    </section>

    <section class="panel">
        <h2>Recent Members</h2>
        <table>
            <tr>
                <th>Name</th><th>Phone</th><th>Plan</th><th>Join Date</th><th>Fees Status</th><th>Training Goal</th>
            </tr>
            <tr th:each="m : ${members}">
                <td th:text="${m.name}"></td>
                <td th:text="${m.phone}"></td>
                <td th:text="${m.plan}"></td>
                <td th:text="${m.joinDate}"></td>
                <td><span class="status" th:classappend="${m.feesStatus == 'Paid'} ? ' paid' : ' due'" th:text="${m.feesStatus != null ? m.feesStatus : 'Not set'}"></span></td>
                <td th:text="${m.trainingType != null ? m.trainingType : 'Not set'}"></td>
            </tr>
        </table>
    </section>
</main>
</body>
</html>
