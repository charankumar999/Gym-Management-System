spring.application.name=Gym Management System
spring.datasource.url=jdbc:h2:file:./data/gymdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
server.port=8080

# Admin login for local college demonstration.
# Change gym.admin.password to your own password before running.
gym.admin.username=admin
gym.admin.password=ChangeMe123!
